      <stop offset="0.62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0d12" stop-opacity="0.34"/>
    </radialGradient>
    <pattern id="speck" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1" fill="#ffffff" opacity="0.07"/>
      <circle cx="9" cy="8" r="1" fill="#000000" opacity="0.09"/>
    </pattern>
    <filter id="soft2"><feGaussianBlur stdDeviation="2.2"/></filter>
