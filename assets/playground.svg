<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>操场上的纸船 · 纸船拼成的鲸鱼</title>
  <defs>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8452e"/>
      <stop offset="0.6" stop-color="#a53a26"/>
      <stop offset="1" stop-color="#8e2f1f"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#478750"/>
      <stop offset="1" stop-color="#3a6f40"/>
    </linearGradient>
    <linearGradient id="tarp" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#3d8fd6"/>
      <stop offset="0.5" stop-color="#2e7fc2"/>
      <stop offset="1" stop-color="#1b5e9e"/>
    </linearGradient>
