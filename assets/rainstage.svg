      <stop offset="0.6" stop-color="#101a38"/>
      <stop offset="1" stop-color="#1c2748"/>
    </linearGradient>
    <linearGradient id="boards" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#333a48"/>
      <stop offset="1" stop-color="#232833"/>
    </linearGradient>
    <linearGradient id="wet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5c80"/>
      <stop offset="0.25" stop-color="#354462"/>
      <stop offset="1" stop-color="#232c42"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#cfe4ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#cfe4ff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="umb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e05545"/>
      <stop offset="0.6" stop-color="#c0392b"/>
      <stop offset="1" stop-color="#8e2418"/>
