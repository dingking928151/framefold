    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d6069"/>
      <stop offset="0.5" stop-color="#2e4a52"/>
      <stop offset="1" stop-color="#22383f"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dfe9ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#dfe9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign2" cx="0.5" cy="0.46" r="0.78">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#04060f" stop-opacity="0.45"/>
