    </g>
    <path d="M1100 200 L560 250 L560 430 L1100 260 Z" fill="#ffbe6e" opacity="0.07"/>
  </g>

  <!-- 摄影机与三脚架 -->
  <g>
    <g stroke="#2c3138" stroke-width="9" stroke-linecap="round">
      <line x1="940" y1="474" x2="884" y2="640"/>
      <line x1="940" y1="474" x2="1002" y2="640"/>
      <line x1="940" y1="474" x2="944" y2="652"/>
    </g>
    <rect x="922" y="458" width="36" height="20" rx="4" fill="#3a4048"/>
    <rect x="898" y="412" width="96" height="52" rx="8" fill="#22262b"/>
    <rect x="906" y="404" width="52" height="12" rx="4" fill="#33383f"/>
    <rect x="856" y="424" width="46" height="28" rx="6" fill="#15181c"/>
    <circle cx="858" cy="438" r="12" fill="#0b0d10"/>
    <circle cx="858" cy="438" r="7" fill="#274b66"/>
    <circle cx="856" cy="435" r="2.5" fill="#9fd4ee"/>
    <circle cx="982" cy="422" r="4" fill="#ff4d4d"/>
    <g transform="rotate(8 1008 436)">
      <rect x="994" y="418" width="34" height="26" rx="3" fill="#15181c"/>
      <rect x="997" y="421" width="28" height="20" rx="2" fill="#7db8dc"/>
    </g>
  </g>
  <!-- 摄影师 -->
  <g>
    <path d="M1030 392 C 1024 430, 1024 470, 1030 520 L1030 636 L1046 636 L1050 540 L1058 636 L1074 636 L1072 510 C 1078 460, 1074 420, 1064 392 Z" fill="#2e343c"/>
    <path d="M1032 396 C 1020 420, 1006 434, 992 440 L996 452 C 1014 448, 1030 436, 1040 420 Z" fill="#2e343c"/>
    <circle cx="1047" cy="372" r="17" fill="#e8b98f"/>
    <path d="M1030 366 C 1032 352, 1060 350, 1064 366 L1064 372 C 1056 362, 1038 362, 1030 372 Z" fill="#241d18"/>
    <path d="M1028 368 C 1024 380, 1028 388, 1032 390" fill="none" stroke="#15181c" stroke-width="5"/>
    <circle cx="1030" cy="380" r="5" fill="#15181c"/>
    <rect x="1040" y="470" width="10" height="26" rx="3" fill="#e8c33d"/>
    <path d="M1030 636 l-8 8 h26 l-4 -8 Z" fill="#15181c"/>
    <path d="M1058 636 l-4 8 h26 l-8 -8 Z" fill="#15181c"/>
  </g>

  <!-- 岩石布景台 -->
  <g>
    <path d="M140 302 L430 302 L455 290 L165 290 Z" fill="url(#rockTop)"/>
    <path d="M140 302 L430 302 L430 486 L140 486 Z" fill="url(#rock)"/>
    <path d="M430 302 L455 290 L455 478 L430 486 Z" fill="#4a4038"/>
    <!-- 岩面裂纹与棱角 -->
    <g stroke="#3f362e" stroke-width="2.5" fill="none" opacity="0.6">
      <path d="M180 320 L214 356 L202 402 L230 452"/>
      <path d="M300 306 L288 350 L320 392 L306 440 L330 480"/>
      <path d="M392 310 L404 356 L386 400 L410 452"/>
      <path d="M160 372 L200 380"/>
      <path d="M340 340 L380 348"/>
    </g>
    <path d="M140 302 L430 302 L430 316 L140 316 Z" fill="#c4b29a" opacity="0.5"/>
    <path d="M418 302 L430 302 L430 486 L418 486 Z" fill="#d9a05b" opacity="0.35"/>
    <g fill="#6d7a5c" opacity="0.55">
      <ellipse cx="196" cy="466" rx="20" ry="7"/>
      <ellipse cx="352" cy="472" rx="26" ry="8"/>
    </g>
    <!-- 布景台木撑(全景可见) -->
    <rect x="150" y="486" width="14" height="86" fill="#6b4a28"/>
    <rect x="396" y="486" width="14" height="86" fill="#6b4a28"/>
    <!-- 台上的水瓶 -->
    <rect x="196" y="266" width="12" height="26" rx="4" fill="#7fd0e8" opacity="0.9"/>
    <rect x="199" y="260" width="6" height="8" rx="2" fill="#3d444c"/>
  </g>

  <!-- 蓝色安全垫 -->
  <g>
    <rect x="150" y="480" width="550" height="96" rx="10" fill="url(#mat)"/>
    <rect x="150" y="480" width="550" height="16" rx="8" fill="#6aa4f0" opacity="0.8"/>
    <g stroke="#163a80" stroke-width="3" opacity="0.7">
      <line x1="335" y1="486" x2="335" y2="572"/>
      <line x1="520" y1="486" x2="520" y2="572"/>
    </g>
    <g stroke="#0f2f6e" stroke-width="4" opacity="0.6">
      <line x1="180" y1="540" x2="212" y2="540"/>
      <line x1="640" y1="540" x2="672" y2="540"/>
    </g>
    <text x="426" y="552" text-anchor="middle" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#cfe2ff" opacity="0.85" letter-spacing="6">安全垫</text>
    <rect x="150" y="568" width="550" height="8" rx="4" fill="#122c60" opacity="0.7"/>
  </g>
  <!-- 沙袋 -->
  <path d="M712 552 q 10 -26 44 -22 q 34 4 30 26 q -2 14 -36 14 q -36 0 -38 -18 Z" fill="#b09a6e"/>
  <path d="M736 532 q 8 -8 16 -2" fill="none" stroke="#8a764e" stroke-width="4"/>

  <!-- 救援者:趴在台沿 -->
  <g>
    <!-- 翘起的小腿 -->
    <path d="M336 288 C 318 272, 306 258, 302 244 L316 236 C 322 250, 334 262, 348 272 Z" fill="#2e3f66"/>
    <path d="M302 244 C 300 232, 306 222, 318 218 L326 230 C 320 234, 316 240, 316 246 Z" fill="#2e3f66"/>
    <path d="M316 216 l14 -6 l6 12 l-14 8 Z" fill="#f2f2ee"/>
    <path d="M344 292 C 330 282, 322 270, 320 258 L332 252 C 336 264, 344 274, 356 282 Z" fill="#24335a"/>
    <path d="M320 258 l12 -8 l7 11 l-13 9 Z" fill="#e4e4de"/>
    <!-- 躯干(白色校服外套) -->
    <path d="M330 296 C 356 284, 392 276, 418 274 L424 296 C 398 300, 362 304, 336 306 Z" fill="#f2f2ee"/>
    <path d="M336 296 C 360 288, 392 282, 416 280" fill="none" stroke="#2e3f66" stroke-width="4"/>
    <!-- 撑地手臂 -->
    <path d="M398 282 C 392 288, 388 294, 388 300 L398 302 C 400 296, 404 290, 408 286 Z" fill="#e8e8e2"/>
    <ellipse cx="392" cy="302" rx="7" ry="5" fill="#e8b98f"/>
    <!-- 头部 -->
    <circle cx="438" cy="266" r="16" fill="#e8b98f"/>
    <path d="M422 262 C 424 246, 452 244, 455 260 L452 266 C 446 254, 430 254, 424 268 Z" fill="#241d18"/>
    <path d="M446 272 q 4 2 7 0" stroke="#b0764a" stroke-width="2" fill="none"/>
    <!-- 下伸的救援手臂 -->
    <path d="M420 280 C 436 296, 448 316, 458 338 L470 352 L458 360 C 444 340, 430 318, 414 298 Z" fill="#f2f2ee"/>
    <path d="M458 338 L470 352 L458 360 L450 348 Z" fill="#e8b98f"/>
  </g>

  <!-- 悬空者 -->
  <g>
    <!-- 被握住的手腕 -->
    <path d="M466 350 C 466 364, 464 378, 462 390 L450 388 C 452 376, 454 364, 454 352 Z" fill="#e8b98f"/>
    <ellipse cx="462" cy="352" rx="9" ry="7" fill="#e8b98f"/>
    <path d="M456 348 q 6 -4 12 0" stroke="#c98d5e" stroke-width="2" fill="none"/>
    <!-- 躯干(藏青校服) -->
    <path d="M446 388 C 440 406, 440 428, 446 448 L484 448 C 490 426, 488 404, 480 388 C 470 382, 456 382, 446 388 Z" fill="#2e3f66"/>
    <path d="M463 386 L463 448" stroke="#f2f2ee" stroke-width="3"/>
    <path d="M448 396 C 456 392, 472 392, 480 396" stroke="#f2f2ee" stroke-width="3" fill="none"/>
    <!-- 甩出的另一只手臂 -->
    <path d="M478 396 C 494 392, 510 386, 522 380 L528 390 C 516 398, 500 404, 484 408 Z" fill="#2e3f66"/>
    <path d="M522 380 l10 -4 l3 6 l-9 6 Z" fill="#e8b98f"/>
    <path d="M532 376 l6 -3 M534 382 l7 -1" stroke="#e8b98f" stroke-width="3" stroke-linecap="round"/>
    <!-- 头部(仰望) -->
    <circle cx="456" cy="400" r="15" fill="#e8b98f"/>
    <path d="M442 396 C 440 382, 466 378, 471 392 L468 398 C 462 388, 450 388, 445 402 Z" fill="#1c1613"/>
    <path d="M441 394 c -5 -3 -8 -8 -8 -13" stroke="#1c1613" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- 滑落的红色书包 -->
    <path d="M482 414 q 18 2 20 20 q 0 16 -16 18 q -14 0 -16 -16 q 0 -18 12 -22 Z" fill="#d9553f"/>
    <path d="M486 416 q 10 2 12 14" stroke="#a83a28" stroke-width="3" fill="none"/>
    <path d="M480 414 C 474 406, 470 400, 468 394" stroke="#a83a28" stroke-width="4" fill="none"/>
    <!-- 蜷起的双腿(脚刚好在垫子上方) -->
    <path d="M450 446 C 442 456, 438 464, 440 470 L456 476 C 456 468, 460 460, 466 452 Z" fill="#24335a"/>
    <path d="M440 470 l16 6 l-3 8 l-17 -6 Z" fill="#f2f2ee"/>
    <path d="M474 446 C 480 456, 482 464, 478 472 L464 476 C 466 468, 466 460, 462 452 Z" fill="#2e3f66"/>
    <path d="M478 472 l-14 4 l2 8 l16 -5 Z" fill="#e4e4de"/>
    <g stroke="#9fb6c8" stroke-width="2" opacity="0.5" stroke-linecap="round">
      <path d="M432 452 l-8 6"/>
      <path d="M490 456 l8 6"/>
    </g>
  </g>

  <!-- 暖色主光与氛围 -->
  <rect width="1200" height="720" fill="url(#keyGlow)"/>
  <rect width="1200" height="720" fill="url(#vign)"/>
  <rect width="1200" height="720" filter="url(#grain)" opacity="0.05"/>
</svg>