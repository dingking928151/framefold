<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <title>校园摄影棚 · 毕业短片拍摄现场</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b343c"/>
      <stop offset="0.7" stop-color="#3c4850"/>
      <stop offset="1" stop-color="#46525a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6db6e2"/>
      <stop offset="0.55" stop-color="#a5d3ee"/>
      <stop offset="1" stop-color="#d8ecf6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a97c50"/>
      <stop offset="1" stop-color="#7c5834"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93826f"/>
      <stop offset="0.5" stop-color="#7a6a58"/>
      <stop offset="1" stop-color="#5a4d40"/>
    </linearGradient>
    <linearGradient id="rockTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3a28c"/>
      <stop offset="1" stop-color="#8f7e6a"/>
    </linearGradient>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a8ae8"/>
      <stop offset="0.18" stop-color="#2f6fd1"/>
      <stop offset="1" stop-color="#1c479c"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c877"/>
      <stop offset="1" stop-color="#e89a52"/>
    </linearGradient>
    <radialGradient id="keyGlow" cx="0.86" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#ffbe6e" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffbe6e" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffbe6e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="softGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9c2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe9c2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0.62" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0a0d12" stop-opacity="0.34"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <!-- 体育馆墙面 -->
  <rect width="1200" height="720" fill="url(#wall)"/>
  <g stroke="#242d34" stroke-width="2" opacity="0.5">
    <line x1="150" y1="0" x2="150" y2="570"/>
    <line x1="900" y1="0" x2="900" y2="570"/>
    <line x1="1050" y1="0" x2="1050" y2="570"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
  </g>
  <rect x="0" y="548" width="1200" height="24" fill="#232b31"/>

  <!-- 高窗与傍晚光 -->
  <g>
    <rect x="828" y="52" width="150" height="96" rx="4" fill="url(#window)"/>
    <rect x="1002" y="52" width="150" height="96" rx="4" fill="url(#window)"/>
    <g stroke="#2b343c" stroke-width="6">
      <line x1="903" y1="52" x2="903" y2="148"/>
      <line x1="1077" y1="52" x2="1077" y2="148"/>
      <line x1="828" y1="100" x2="978" y2="100"/>
      <line x1="1002" y1="100" x2="1152" y2="100"/>
    </g>
    <rect x="828" y="52" width="324" height="96" rx="4" fill="none" stroke="#20282e" stroke-width="8"/>
  </g>

  <!-- 横幅 -->
  <g>
    <path d="M836 186 L1092 186 L1084 244 L844 244 Z" fill="#c8352b"/>
    <path d="M836 186 L1092 186 L1088 200 L840 200 Z" fill="#a02419" opacity="0.6"/>
    <text x="964" y="225" text-anchor="middle" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="22" fill="#ffe9d2" letter-spacing="2">毕业短片 · 拍摄中</text>
    <circle cx="842" cy="190" r="3" fill="#7c1a12"/>
    <circle cx="1086" cy="190" r="3" fill="#7c1a12"/>
  </g>

  <!-- 木地板 -->
  <rect x="0" y="570" width="1200" height="150" fill="url(#floor)"/>
  <g stroke="#6b4a28" stroke-width="2" opacity="0.6">
    <line x1="0" y1="602" x2="1200" y2="602"/>
    <line x1="0" y1="638" x2="1200" y2="638"/>
    <line x1="0" y1="678" x2="1200" y2="678"/>
    <line x1="240" y1="570" x2="200" y2="720"/>
    <line x1="620" y1="570" x2="600" y2="720"/>
    <line x1="980" y1="570" x2="1010" y2="720"/>
  </g>
  <!-- 场地胶带标记 -->
  <g stroke="#e8c33d" stroke-width="5" opacity="0.85">
    <path d="M744 636 l22 22 M766 636 l-22 22"/>
    <path d="M282 664 l20 20 M302 664 l-20 20"/>
  </g>
  <!-- 地面线缆 -->
  <path d="M948 640 C 1010 668, 1080 650, 1130 690 S 1180 706, 1200 700" fill="none" stroke="#15181c" stroke-width="6" stroke-linecap="round"/>
  <path d="M120 600 C 200 640, 260 620, 330 660" fill="none" stroke="#15181c" stroke-width="5" stroke-linecap="round" opacity="0.8"/>

  <!-- 背景布支架 -->
  <g>
    <rect x="124" y="36" width="9" height="552" rx="3" fill="#8d949c"/>
    <rect x="784" y="36" width="9" height="552" rx="3" fill="#8d949c"/>
    <rect x="110" y="30" width="696" height="9" rx="4" fill="#9aa1a9"/>
    <path d="M104 588 L152 588 L128 560 Z" fill="#6d747c"/>
    <path d="M764 588 L812 588 L788 560 Z" fill="#6d747c"/>
    <circle cx="128" cy="40" r="6" fill="#5d646c"/>
    <circle cx="788" cy="40" r="6" fill="#5d646c"/>
  </g>

  <!-- 手绘天空背景布 -->
  <g>
    <path d="M140 48 L780 48 L780 496 Q 700 506 620 498 Q 500 490 380 500 Q 260 508 140 498 Z" fill="url(#sky)"/>
    <!-- 画上去的云 -->
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="262" cy="142" rx="64" ry="22"/>
      <ellipse cx="300" cy="128" rx="42" ry="18"/>
      <ellipse cx="500" cy="106" rx="70" ry="20"/>
      <ellipse cx="540" cy="94" rx="40" ry="15"/>
      <ellipse cx="660" cy="188" rx="56" ry="18"/>
      <ellipse cx="620" cy="176" rx="34" ry="13"/>
    </g>
    <g fill="#bcd7e8" opacity="0.7">
      <ellipse cx="270" cy="152" rx="56" ry="10"/>
      <ellipse cx="508" cy="116" rx="60" ry="9"/>
      <ellipse cx="662" cy="196" rx="48" ry="8"/>
    </g>
    <!-- 远山(画在布上) -->
    <path d="M140 470 L220 396 L300 452 L392 384 L470 448 L560 392 L650 456 L720 410 L780 462 L780 500 L140 500 Z" fill="#6f8fae"/>
    <path d="M140 500 L200 452 L280 492 L360 440 L450 496 L540 446 L640 498 L720 458 L780 494 L780 504 L140 504 Z" fill="#56718c"/>
    <!-- 布面折痕与夹子 -->
    <g stroke="#4a7fa0" stroke-width="2" opacity="0.12">
      <line x1="300" y1="48" x2="296" y2="500"/>
      <line x1="470" y1="48" x2="474" y2="498"/>
      <line x1="640" y1="48" x2="636" y2="500"/>
    </g>
    <g fill="#3d444c">
      <rect x="196" y="40" width="14" height="20" rx="3"/>
      <rect x="376" y="40" width="14" height="20" rx="3"/>
      <rect x="556" y="40" width="14" height="20" rx="3"/>
      <rect x="726" y="40" width="14" height="20" rx="3"/>
    </g>
    <path d="M780 48 L780 496 L768 492 L768 52 Z" fill="#3f6f92" opacity="0.35"/>
  </g>

  <!-- 左侧场务小桌 -->
  <g>
    <rect x="52" y="520" width="76" height="10" rx="3" fill="#5d4a32"/>
    <rect x="60" y="530" width="8" height="72" fill="#4a3a26"/>
    <rect x="112" y="530" width="8" height="72" fill="#4a3a26"/>
    <rect x="62" y="506" width="44" height="14" rx="2" fill="#efe6d4"/>
    <rect x="66" y="502" width="44" height="14" rx="2" fill="#f7f0e0"/>
    <g stroke="#b9ad94" stroke-width="1.5">
      <line x1="72" y1="507" x2="102" y2="507"/>
      <line x1="72" y1="511" x2="98" y2="511"/>
    </g>
    <path d="M40 596 l26 -8 l4 14 l-26 8 Z" fill="#d9553f"/>
    <rect x="64" y="586" width="10" height="12" rx="2" fill="#a83a28"/>
    <rect x="96" y="560" width="12" height="36" rx="4" fill="#7fd0e8" opacity="0.85"/>
    <rect x="98" y="554" width="8" height="8" rx="2" fill="#3d444c"/>
  </g>

  <!-- 柔光灯与灯架 -->
  <g>
    <rect x="1150" y="212" width="8" height="420" rx="3" fill="#7d848c"/>
    <path d="M1122 632 L1186 632 L1154 600 Z" fill="#5d646c"/>
    <ellipse cx="1128" cy="212" rx="86" ry="66" fill="url(#softGlow)"/>
    <g transform="rotate(-14 1154 210)">
      <rect x="1100" y="168" width="88" height="84" rx="10" fill="#22262b"/>
      <rect x="1106" y="174" width="76" height="72" rx="7" fill="#ffe9c2"/>
